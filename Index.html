<!DOCTYPE html>
<html>
<head>
    <title>FB Mass Messenger</title>
    <meta name="viewport" content="width=device-width">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #1a1a2e; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #16213e; padding: 30px; border-radius: 15px; }
        h1 { text-align: center; color: #00d4ff; margin-bottom: 30px; }
        .section { margin-bottom: 30px; padding: 20px; background: #0f3460; border-radius: 10px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; background: #333; color: #fff; }
        button { width: 100%; padding: 15px; background: #00d4ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px 0; }
        button:hover { background: #00b8d4; }
        button.danger { background: #ff4757; color: #fff; }
        .status { padding: 15px; border-radius: 8px; margin: 10px 0; }
        .success { background: #2ed573; }
        .error { background: #ff4757; }
        .group-list { max-height: 300px; overflow-y: auto; }
        .group-item { padding: 10px; background: #533483; margin: 5px 0; border-radius: 5px; cursor: pointer; display: flex; align-items: center; }
        .group-item input[type="checkbox"] { margin-right: 10px; transform: scale(1.5); }
        .progress { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-bar { height: 100%; background: #00d4ff; width: 0%; transition: width 0.3s; }
        #log { background: #000; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 FB Mass Messenger</h1>
        
        {% if not logged_in %}
        <div class="section">
            <h3>1️⃣ LOGIN (Paste Cookies)</h3>
            <form id="loginForm">
                <input type="text" id="c_user" placeholder="c_user cookie" required>
                <input type="text" id="xs" placeholder="xs cookie" required>
                <input type="text" id="fr" placeholder="fr cookie (optional)">
                <input type="text" id="sb" placeholder="sb cookie (optional)">
                <button type="submit">🔑 LOGIN</button>
            </form>
        </div>
        {% else %}
        <div class="status success">✅ Logged in successfully!</div>
        {% endif %}

        {% if logged_in %}
        <div class="section">
            <h3>2️⃣ SELECT GROUPS</h3>
            <div class="group-list" id="groupList">
                {% for group in groups %}
                <div class="group-item">
                    <input type="checkbox" value="{{ group.id }}" checked>
                    <span>{{ group.name }}</span>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="section">
            <h3>3️⃣ CUSTOM MESSAGE</h3>
            <textarea id="customMessage" rows="4" placeholder="Enter your message here...">Hello everyone! 👋</textarea>
        </div>

        <div class="section">
            <h3>4️⃣ MASS SEND</h3>
            <button onclick="startMassSend()" id="massSendBtn">🚀 START MASS MESSAGING</button>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <button class="danger" onclick="logout()">🚪 LOGOUT</button>
        </div>

        <div class="section">
            <h3>📊 LOG</h3>
            <div id="log"></div>
        </div>
        {% endif %}
    </div>

    <script>
        const log = msg => {
            document.getElementById('log').textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
        };

        // Login
        document.getElementById('loginForm')?.addEventListener('submit', async e => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            const res = await fetch('/login', {
                method: 'POST',
                body: new URLSearchParams(data)
            });
            const result = await res.json();
            
            if (result.success) {
                log('✅ Login successful!');
                location.reload();
            } else {
                log(`❌ ${result.message}`);
            }
        });

        // Mass send
        async function startMassSend() {
            const groups = Array.from(document.querySelectorAll('.group-item input:checked')).map(cb => cb.value);
            const message = document.getElementById('customMessage').value;
            
            if (!groups.length || !message) {
                log('❌ Select groups and enter message!');
                return;
            }

            const btn = document.getElementById('massSendBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Sending...';
            
            log(`🚀 Starting mass send to ${groups.length} groups...`);
            
            const res = await fetch('/send_mass', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({groups, message})
            });
            
            const result = await res.json();
            log(`✅ Completed! ${result.results.filter(r => r.success).length}/${result.total} sent successfully`);
            
            btn.disabled = false;
            btn.textContent = '🚀 START MASS MESSAGING';
            
            // Update progress
            document.getElementById('progressBar').style.width = '100%';
            setTimeout(() => document.getElementById('progressBar').style.width = '0%', 2000);
        }

        // Logout
        async function logout() {
            await fetch('/logout');
            location.reload();
        }
    </script>
</body>
</html>
